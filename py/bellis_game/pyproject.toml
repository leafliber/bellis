[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bellis-game"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bellis-common",
    "openai>=3.59.0",
    "pillow>=13.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bellis_game"]
