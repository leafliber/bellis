<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贝莉 · 直播与游戏操作台</title>
  <link rel="stylesheet" href="/console.css">
  <script defer src="/console.js"></script>
</head>
<body>
  <header>
    <div class="brand"><span aria-hidden="true">✳</span> BELLIS <small>操作台</small></div>
    <button id="logout" type="button" disabled>退出登录</button>
  </header>
  <main>
    <section class="transport" aria-label="全局直播总控">
      <div class="transport-head">
        <div class="mode-wrap">
          <div class="mode"><span id="lamp"></span><strong id="mode">连接中…</strong></div>
          <p id="reason" role="status"></p>
        </div>
        <div class="controls">
          <button id="btn-live" class="primary" type="button" data-control="control/live" disabled>开始直播</button>
          <button id="btn-pause" type="button" data-control="control/pause" disabled>暂停直播</button>
          <button id="btn-clear" type="button" data-control="control/clear-emergency" disabled>解除急停</button>
          <button id="btn-emergency" class="stop" type="button" data-control="control/emergency" disabled>紧急停止</button>
        </div>
      </div>
      <div class="health-strip" aria-label="系统连接健康">
        <span class="pill" id="pill-stage" data-state="off">OBS Stage · —</span>
        <span class="pill" id="pill-core" data-state="off">游戏核 · —</span>
        <span class="pill" id="pill-agent" data-state="off">游戏端 · —</span>
        <span class="pill" id="pill-window" data-state="off">游戏窗口 · —</span>
      </div>
    </section>

    <p id="feedback" role="status" aria-live="polite" data-tone="info"></p>

    <section class="hero-game" aria-label="游戏操控与实时进度">
      <div class="game-col">
        <h2>游戏操控与任务</h2>

        <div class="permit-box">
          <div class="permit-head">
            <div>
              <span class="badge" id="permit-badge" data-state="off">未开启</span>
              <span id="permit-detail" class="muted">等待连接游戏核…</span>
            </div>
            <button id="btn-permit" class="primary" type="button" disabled>开启代打</button>
          </div>
          <label class="inline-row">
            <input type="checkbox" id="auto-resume-toggle" disabled>
            <span>真人接管后，切回游戏空闲</span>
            <input type="number" id="auto-resume-idle" class="num-sm" value="5" min="2" max="60" step="1">
            <span>秒自动接回</span>
          </label>
        </div>

        <form id="game-task" class="task-form">
          <div class="mode-switch" role="radiogroup" aria-label="任务模式">
            <label class="radio-pill">
              <input type="radio" name="task_mode" value="continuous" checked>
              <span>连续游玩（自动拆解）</span>
            </label>
            <label class="radio-pill">
              <input type="radio" name="task_mode" value="single">
              <span>单步直达（快循环）</span>
            </label>
          </div>

          <div class="presets" aria-label="常用快捷任务">
            <button type="button" class="chip" data-preset="daily-open">打开每日实训</button>
            <button type="button" class="chip" data-preset="daily-auto">连续推进日常</button>
            <button type="button" class="chip" data-preset="observe">只读观察画面</button>
          </div>

          <label>
            游玩目标
            <textarea id="task-desc" name="description" rows="2" maxlength="200" placeholder="例如：打开星际和平指南查看今日每日实训" required></textarea>
          </label>

          <div class="task-opts">
            <label class="inline-row">
              <span id="steps-label">最多推进轮数</span>
              <input id="task-steps" name="steps" class="num-sm" type="number" min="1" max="30" value="12" required>
            </label>
            <label class="inline-row">
              <input type="checkbox" id="task-auto-arm" checked>
              <span>同时开启代打（切回游戏自动生效）</span>
            </label>
          </div>

          <div class="controls">
            <button id="btn-task-start" type="submit" class="primary" disabled>开始执行</button>
            <button id="btn-task-stop" type="button" disabled>停止任务</button>
          </div>
        </form>
      </div>

      <div class="game-col live-col">
        <h2>实时执行进度</h2>
        <div class="stage-card">
          <div class="stage-top">
            <span class="badge" id="live-badge" data-state="off">空闲</span>
            <span id="live-step-count" class="muted"></span>
          </div>
          <p id="live-goal" class="goal-line">当前无活动任务</p>
          <p id="live-outcome" class="muted"></p>
          <p id="game-highlight" class="note"></p>
          <p id="game-narrative" class="note"></p>
        </div>

        <div id="game-decision" class="decision-box" hidden>
          <strong>需要人工选择</strong>
          <p id="decision-question"></p>
          <div id="decision-options" class="controls"></div>
        </div>

        <h3>最近步骤记录</h3>
        <ol id="game-steps" class="step-list"><li class="muted">暂无步骤记录</li></ol>
      </div>
    </section>

    <div class="panels">
      <section>
        <h2>手动口播</h2>
        <form id="say">
          <label>口播内容<textarea name="text" rows="2" required></textarea></label>
          <div class="controls">
            <button id="btn-say" type="submit" class="primary" disabled>播报</button>
            <button id="btn-interrupt" type="button" data-control="speech/interrupt" disabled>打断发声</button>
          </div>
        </form>
        <h3>最近实际播出</h3>
        <ol id="heard"><li class="muted">暂无播出记录</li></ol>
      </section>

      <section>
        <h2>观众投票</h2>
        <p id="vote-status" role="status" class="muted">暂无进行中的投票</p>
        <ol id="counts"></ol>
        <form id="vote">
          <label>问题<input name="question" maxlength="120" required></label>
          <label>选项（每行一个，2–4 个）<textarea name="options" rows="2" required></textarea></label>
          <div class="controls">
            <label class="inline-row">时长(秒)
              <input name="duration_s" class="num-sm" type="number" value="30" min="10" max="300" required>
            </label>
            <button id="btn-vote-start" type="submit" class="primary" disabled>开始投票</button>
            <button id="btn-vote-close" type="button" data-control="vote/close" disabled>结束投票</button>
          </div>
        </form>
      </section>
    </div>

    <details class="debug-drawer">
      <summary>调试工具 · 模拟观众弹幕（<span id="queue">待处理 0 条</span>）</summary>
      <form id="danmaku" class="debug-form">
        <div class="pair">
          <label>观众 ID<input name="viewer_id" value="operator-test" required></label>
          <label>昵称<input name="viewer_name" value="观众" required></label>
        </div>
        <label>弹幕内容<input name="text" maxlength="120" required></label>
        <button id="btn-danmaku" type="submit" disabled>发送测试弹幕</button>
      </form>
    </details>
  </main>
</body>
</html>
