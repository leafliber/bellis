<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贝莉 · 直播操作台</title>
  <link rel="stylesheet" href="/console.css">
  <script defer src="/console.js"></script>
</head>
<body>
  <header>
    <div class="brand"><span aria-hidden="true">✳</span> BELLIS</div>
    <button id="logout" disabled>退出登录</button>
  </header>
  <main>
    <h1>直播操作台</h1>
    <section class="transport" aria-label="直播控制">
      <div class="mode"><span id="lamp"></span><strong id="mode">连接中…</strong></div>
      <p id="reason" role="status"></p>
      <div class="controls">
        <button class="stop" data-control="control/emergency" disabled>紧急停止</button>
        <button data-control="control/live" disabled>开始直播</button>
        <button data-control="game/arm" disabled>开启游戏操作</button>
        <button data-control="game/disarm" disabled>暂停游戏操作</button>
        <button data-control="control/pause" disabled>暂停直播</button>
        <button data-control="control/clear-emergency" disabled>解除急停</button>
      </div>
      <div class="metrics"><span id="stage">Stage —</span><span id="game-permit">游戏核 —</span><span id="queue">待处理弹幕 —</span></div>
    </section>
    <p id="feedback" role="status" aria-live="polite"></p>
    <div class="panels">
      <section>
        <h2>手动发声</h2>
        <form id="say">
          <label>口播内容<textarea name="text" rows="3" required></textarea></label>
          <div class="controls"><button class="primary" disabled>播报</button>
            <button type="button" data-control="speech/interrupt" disabled>打断发声</button></div>
        </form>
        <h3>最近实际播出</h3>
        <ol id="heard"><li>暂无播出记录</li></ol>
      </section>
      <section>
        <h2>观众投票</h2>
        <p id="vote-status" role="status">暂无进行中的投票</p>
        <ol id="counts"></ol>
        <form id="vote">
          <label>问题<input name="question" maxlength="120" required></label>
          <label>选项（每行一个，共 2–4 个）<textarea name="options" rows="3" required></textarea></label>
          <label>时长（秒）<input type="number" name="duration_s" value="30" min="10" max="300" required></label>
          <div class="controls"><button class="primary" disabled>开始投票</button>
            <button type="button" data-control="vote/close" disabled>结束投票</button></div>
        </form>
      </section>
      <section>
        <h2>测试弹幕</h2>
        <form id="danmaku">
          <div class="pair">
            <label>观众 ID<input name="viewer_id" value="operator-test" required></label>
            <label>昵称<input name="viewer_name" value="观众" required></label>
          </div>
          <label>弹幕内容<input name="text" maxlength="120" required></label>
          <button disabled>发送测试弹幕</button>
        </form>
      </section>
      <section>
        <h2>游戏目标</h2>
        <p id="game-status" role="status">游戏端 未连接</p>
        <p id="game-objective-status" role="status"></p>
        <p id="game-highlight" role="status"></p>
        <p id="game-narrative" role="status"></p>
        <div id="game-decision" hidden>
          <p id="decision-question"></p>
          <div id="decision-options" class="controls"></div>
        </div>
        <form id="game-objective">
          <label>连续总目标<input name="description" maxlength="200" placeholder="例如：完成今日每日实训或推进当前主线剧情"></label>
          <div class="pair">
            <label><input type="checkbox" name="auto_continue" checked> 自动推进下一步</label>
            <label>自动步数上限<input name="max_auto_steps" type="number" min="1" max="30" value="12"></label>
          </div>
          <div class="controls">
            <button type="submit" disabled>设定总目标</button>
            <button type="button" data-control="game/objective" disabled>清除总目标</button>
          </div>
        </form>
        <form id="game-goal">
          <label>目标描述<textarea name="description" rows="2" required></textarea></label>
          <label>最大步数<input name="max_steps" type="number" min="1" max="20" value="8" required></label>
          <div class="controls">
            <button type="submit" class="primary" disabled>下发目标</button>
            <button type="button" data-control="game/pause" disabled>暂缓执行</button>
            <button type="button" data-control="game/resume" disabled>恢复执行</button>
            <button type="button" data-control="game/cancel" disabled>取消目标</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
