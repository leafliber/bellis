[project]
name = "bellis"
version = "0.1.0"
description = "Live streaming AI agent framework powered by LangGraph + PydanticAI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.4.0",
    "pydantic-ai>=0.2.0",
    "pydantic>=2.10.0",
    "langchain-core>=0.3.0",
    "websockets>=14.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[project.scripts]
bellis = "bellis:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
bellis = { workspace = true }
plugins = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["bellis*", "plugins*"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "llm: tests that require real LLM API calls (deselected by default)",
]
addopts = "-m 'not llm'"
