game_id = "hsr"
display_name = "Honkai: Star Rail"

[window]
process_name = "StarRail.exe"
window_class = "UnityWndClass"

[display]
expected_width = 1920
expected_height = 1080

[vlm]
base_url = "https://ark.cn-beijing.volces.com/api/plan/v3"
model = "deepseek-v4.1-flash"
reasoning_effort = "low"
max_long_edge = 1280
image_format = "jpeg"
jpeg_quality = 85
timeout_s = 30.0
cred_targets = ["ark.bellis", "ark.bellis-game-runtime"]

[input]
click_buttons = ["left"]
scroll = true
hold_keys = ["w", "a", "s", "d"]
max_hold_ms = 1800
press_duration_ms = 60
max_rate = 3.0
click_regions = [{ left = 0.01, top = 0.01, right = 0.99, bottom = 0.99 }]
forbidden_zones = [{ left = 0.97, top = 0.0, right = 1.0, bottom = 0.025 }]
controls_hint = """Game-specific PC controls:
- In 3D overworld exploration, the mouse cursor is locked to the camera and CANNOT click HUD icons directly. ALWAYS use key_press hotkeys from overworld (once a 2D menu/panel is open, the cursor unlocks and click/scroll work):
  - f4: open Interastral Peace Guide (星际和平指南 / 每日实训 / 生存索引) directly
  - esc: open Phone menu (手机菜单) or close the current menu
  - j: open Missions / Quests list (任务列表)
  - m: open Map / Teleport (地图)
  - v: toggle quest navigation marker (追踪导航)
  - f: interact / talk / activate nearby prompt
  - space: advance dialogue or confirm
  - w/a/s/d via hold_key: move character in overworld
  - r: toggle Auto-Battle (自动战斗) during combat; q/e/1/2/3/4: combat skills/ultimates"""

[input.keys]
esc = 1
"1" = 2
"2" = 3
"3" = 4
"4" = 5
q = 16
w = 17
e = 18
r = 19
enter = 28
a = 30
s = 31
d = 32
f = 33
j = 36
v = 47
m = 50
space = 57
f4 = 62
