[package]
name = "bellis-channel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Authenticated local IPC channel (bellis-channel/1) over Windows Named Pipes with JSON-RPC 2.0 peer"

[dependencies]
getrandom.workspace = true
hmac.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
workspace = true
