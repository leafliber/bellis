name: ci

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows 11 为正式支持门槛，macOS 为当前开发门槛（docs/phase-1-reference.md）。
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: pnpm

      - name: Configure Windows C compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (runtime baseline, build, typecheck, lint, format, contracts, tests)
        run: pnpm check

      - name: Install standalone Iris Provider with the frozen SDK archive
        run: pnpm --dir providers/memory-iris install --frozen-lockfile

      - name: Check standalone Iris Provider
        run: pnpm --dir providers/memory-iris check

      - name: Install Chromium for offline acceptance
        run: pnpm --filter @bellis/stage exec playwright install chromium

      - name: Phase 1–3 acceptance (demos, crash recovery, Chromium)
        run: pnpm test:acceptance

      - name: Upload demo diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-diagnostics-${{ matrix.os }}
          # 仅上传 CI 自身日志（数据库只在临时目录且已被 Demo 清理，
          # 不上传任何本地 Payload）。
          path: |
            pnpm-debug.log
          if-no-files-found: ignore
          retention-days: 3
