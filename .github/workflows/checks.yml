name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.11.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Generated-file drift, contract/doc consistency, types, lint and tests.
      # Structural checks only; not a production acceptance run.
      - name: Check
        run: pnpm check

      - name: SQLite crash-window probe
        if: runner.os != 'Windows'
        run: pnpm spike:sqlite

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: reports/
          if-no-files-found: warn
